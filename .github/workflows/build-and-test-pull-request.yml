name: Build and Test Pull Request

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-pull-request:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version-file: '.tool-versions'
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew verifyMaintenanceJava clean build
      - name: Browser and scanner fixture tests
        run: node --test src/test/js/*.test.cjs
      - name: Resolved dependency security gate
        run: ./gradlew dependencyScan
      - name: Retain security inventory, licenses and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security
          path: build/dependency-security/
          retention-days: 30
