name: Build and Test Pull Request

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-pull-request:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned maintenance JDK
        run: |
          curl --fail --location --connect-timeout 10 --max-time 300 --output "$RUNNER_TEMP/temurin21.tar.gz" \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz'
          echo "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  $RUNNER_TEMP/temurin21.tar.gz" | sha256sum --check --strict
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21.0.12+101'
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/temurin21.tar.gz
          architecture: x64
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew verifyMaintenanceJava clean build
      - name: Browser and scanner fixture tests
        run: node --test src/test/js/*.test.cjs
      - name: Resolved dependency security gate
        run: ./gradlew dependencyScan
      - name: Retain security inventory, licenses and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security
          path: build/dependency-security/
          retention-days: 30
