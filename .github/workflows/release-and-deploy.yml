name: Release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Explicit operator-approved environment
        type: environment
        default: stage
        required: true

permissions:
  contents: read

concurrency:
  group: regata-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21.0.12.1+1'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build, fixtures and dependency gate
        run: |
          ./gradlew verifyMaintenanceJava clean build
          node --test src/test/js/*.test.cjs
          bash -n scripts/deploy-release.sh
          ./gradlew dependencyScan
      - name: Retain dependency/security/license evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security
          path: build/dependency-security/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: regata-release
          path: build/libs/RegataSimulator-0.0.1.jar
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: regata-release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Transfer immutable artifact and invoke checked-in release logic
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME }}
          SERVER_ROOT: ${{ vars.SERVER_ROOT }}
          SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SERVER_USERNAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SERVER_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ && "$SERVER_ROOT" != *'/../'* && "$SERVER_ROOT" != *'/./'* && "$SERVER_ROOT" != / ]]
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}$ && -n "$SERVER_KNOWN_HOSTS" ]]
          hosts=$(mktemp)
          trap 'rm -f "$hosts"' EXIT
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts"
          ssh-keygen -l -f "$hosts" >/dev/null
          options=(-o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          remote="$SERVER_USERNAME@$SERVER_HOST"
          checksum=$(shasum -a 256 RegataSimulator-0.0.1.jar | cut -d ' ' -f 1)
          schema=$(sed -n 's/^--changeset regata:\([0-9]*\).*/\1/p' src/main/resources/db/changelog/sqlite.sql | tail -n 1)
          ssh "${options[@]}" "$remote" "umask 077; mkdir '$SERVER_ROOT/incoming/$RELEASE_ID'"
          scp "${options[@]}" RegataSimulator-0.0.1.jar "$remote:$SERVER_ROOT/incoming/$RELEASE_ID/app.jar"
          ssh "${options[@]}" "$remote" "bash -s -- '$SERVER_ROOT' '$RELEASE_ID' '$checksum' '$schema' artifact-only-schema-compatible" < scripts/deploy-release.sh
          # systemd unit and runtime environment are provisioned separately by an operator.
          # Never transmit/decrypt runtime secrets or tail application logs here.
