spring:
  application:
    name: bilubot
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
management:
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
        external:
          include: telegramBot
  endpoints:
    web:
      exposure:
        include: health
jasypt:
  encryptor:
    password: ${REGATA_SIMULATOR_ENC_PASSWORD}
regata-simulator:
  database:
    path: ${REGATA_SIMULATOR_DB_PATH}
  sources:
    path: ${REGATA_SIMULATOR_SOURCES_PATH}
    initial-weight: 10
  templates:
    path: ${REGATA_SIMULATOR_TEMPLATES_PATH}
    initial-weight: 10
magick:
  path: ${MAGICK_PATH}
web-admin:
  username: ENC(a+52ciCbjfdlGZzl1LUqul7UdgrGEu1+glWkeZ2plrlx2b1PBPk8S3LmIbcimHR4)
  password: ENC(z0G/zDkWVyOkkyjxVv14iyc3SD2Tpcbf79ap5shPDM21zHt/02ebwNbO9BjOpCgo)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true